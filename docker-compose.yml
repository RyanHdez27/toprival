services:
  postgres:
    image: postgres:16-alpine
    container_name: toprival_postgres
    restart: always
    environment:
      POSTGRES_USER: toprival_user
      POSTGRES_PASSWORD: toprival_password
      POSTGRES_DB: toprival_db
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/services/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
